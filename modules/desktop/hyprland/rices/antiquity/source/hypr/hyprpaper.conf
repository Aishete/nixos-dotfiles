# Antiquity wallpaper config (generated by Nix).
#
# hyprpaper 0.8.4 has no `preload` IPC verb, so the only way to avoid the
# bright "flash" when switching wallpapers is to PRELOAD every candidate image
# here. Preloading buffers the texture once; the `wallpaper` IPC then swaps to
# the already-buffered image with no reparse/flash.
#
# NOTE: absolute paths only (hyprpaper does NOT expand ~). The QML/selector
# only ever switch between the paths listed below, so preloading all of them
# keeps every switch flash-free.

preload = /home/archdev/.local/share/wallpapers/galaxy.webp
preload = /home/archdev/.local/share/wallpapers/georges_riom_collage.png
preload = /home/archdev/.local/share/wallpapers/carnation_collage.png
preload = /home/archdev/.local/share/wallpapers/oc_the_blackboard.png
preload = /home/archdev/.local/share/wallpapers/ALCHEMY-dark.png
preload = /home/archdev/.local/share/wallpapers/HIRAETH.png

wallpaper = eDP-1, /home/archdev/.local/share/wallpapers/galaxy.webp, cover
wallpaper = DP-1, /home/archdev/.local/share/wallpapers/galaxy.webp, cover
wallpaper = HDMI-A-2, /home/archdev/.local/share/wallpapers/galaxy.webp, cover

# Kill the startup splash so there's never a white flash on login.
splash = false
