[buildPlans.Caelusevka]
family = "caelusevka"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.Caelusevka.variants.design]
one = "base-flat-top-serif"
three = "flat-top-serifless"
seven = "straight-serifless"
zero = "slashed"
capital-g = "toothed-serifless-hooked"
capital-j = "serifed"
a = "double-storey-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless"
g = "single-storey-serifless"
l = "serifed"
t = "flat-hook"
braille-dot = "round"
tilde = "low"
asterisk = "penta-low"
underscore = "high"
caret = "medium"
ascii-single-quote = "raised-comma"
brace = "curly-flat-boundary"
guillemet = "straight"
at = "threefold-solid-inner"
dollar = "open"
cent = "open"
percent = "dots"

[buildPlans.Caelusevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Caelusevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Caelusevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Caelusevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

